<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}MADA DAQ Server{% endblock %}</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand"><a href="/">MADA DAQ Server</a></div>
  {% if user %}
  <nav>
    <a href="/">Dashboard</a>
    <a href="/runs">Runs</a>
    <a href="/log">Log</a>
    <a href="/history">History</a>
  </nav>
  <div class="who">
    {{ user.username }} ({{ 'operator' if user.role == 'operator' else 'viewer' }})
    <form method="post" action="/logout" class="inline"><button type="submit">Logout</button></form>
  </div>
  {% endif %}
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
