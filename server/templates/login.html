{% extends "base.html" %}
{% block title %}ログイン - MADA DAQサーバー{% endblock %}
{% block content %}
<div class="login-box">
  <h1>ログイン</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label>ユーザー名 <input type="text" name="username" required autofocus></label>
    <label>パスワード <input type="password" name="password" required></label>
    <button type="submit">ログイン</button>
  </form>
</div>
{% endblock %}
